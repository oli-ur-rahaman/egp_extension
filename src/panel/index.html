<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eGP Extractor</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="progress" class="progress" hidden></div>
  <header class="appbar">
    <img src="../icons/icon.svg" alt="" width="24" height="24">
    <h1>eGP Extractor</h1>
    <span id="version" class="version">v—</span>
    <span id="status" class="status" data-state="pending" role="status" aria-live="polite">Connecting…</span>
    <button id="settings" type="button" class="icon-btn" aria-label="Office hierarchy" title="Office hierarchy">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h6M17 15v6M14 18h6"/></svg>
    </button>
  </header>

  <main id="screen"></main>
  <div id="sheet" hidden></div>

  <script type="module" src="panel.js"></script>
</body>
</html>
